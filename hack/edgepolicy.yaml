apiVersion: security.vitistack.io/v1alpha1
kind: EdgePolicy
metadata:
  name: my-edge-policy
spec:
  datacenter: no-east-az1
  filter:
    enable: true
    additionalPortList:
      - name: ping
        port: 0
        protocol: ICMP
      - name: custom-app
        port: 8100
        protocol: TCP
  allowedRegion:
    region: nordics
    additionalAllowList:
      - 192.168.10.0/24
      - 2001:db8:1234::/48
  targetRef:
    apiVersion: v1
    kind: Service
    name: my-service
