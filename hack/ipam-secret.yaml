# ipam-secret.yaml - Example default IPAM credential for local testing.
#
# The operator resolves the Secret named by a Service's ipam.vitistack.io/secret
# annotation. When that annotation's value is "default", it reads this Secret:
# name "default" in namespace "ipam-system" (see defaultSecret* constants in the
# controller). The data key must be "secret"; its value is the plaintext password
# once base64-decoded.
#
# Apply with:
#   kubectl apply -f hack/ipam-secret.yaml
# Applying the Namespace object creates ipam-system if it does not already exist
# and is a no-op if it does.
#
# To make hack/service.yaml use it, add this annotation to the Service:
#   ipam.vitistack.io/secret: default
---
apiVersion: v1
kind: Namespace
metadata:
  name: ipam-system
---
apiVersion: v1
kind: Secret
metadata:
  name: default
  namespace: ipam-system
type: Opaque
data:
  # base64("my-awesome-password")
  secret: bXktYXdlc29tZS1wYXNzd29yZA==
