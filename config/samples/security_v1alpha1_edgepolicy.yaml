apiVersion: security.vitistack.io/v1alpha1
kind: EdgePolicy
metadata:
  labels:
    app.kubernetes.io/name: edgeguard-operator
    app.kubernetes.io/managed-by: kustomize
  name: edgepolicy-sample
spec:
  datacenter: no-east-az1
  filter:
    enabled: true
    additionalPortList:
      - name: custom-app
        port: 8080
        protocol: TCP
  targetRef:
    apiVersion: v1
    kind: Service
    name: my-service
