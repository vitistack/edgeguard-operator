---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - delete
  - get
  - list
  - patch
  - watch
- apiGroups:
  - security.vitistack.io
  resources:
  - edgepolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.vitistack.io
  resources:
  - edgepolicies/finalizers
  verbs:
  - update
- apiGroups:
  - security.vitistack.io
  resources:
  - edgepolicies/status
  verbs:
  - get
  - patch
  - update
