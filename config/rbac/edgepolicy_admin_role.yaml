# This rule is not used by the project edgeguard-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over security.vitistack.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: edgeguard-operator
    app.kubernetes.io/managed-by: kustomize
  name: edgepolicy-admin-role
rules:
- apiGroups:
  - security.vitistack.io
  resources:
  - edgepolicies
  verbs:
  - '*'
- apiGroups:
  - security.vitistack.io
  resources:
  - edgepolicies/status
  verbs:
  - get
