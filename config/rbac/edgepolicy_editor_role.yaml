# This rule is not used by the project edgeguard-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the security.vitistack.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: edgeguard-operator
    app.kubernetes.io/managed-by: kustomize
  name: edgepolicy-editor-role
rules:
- apiGroups:
  - security.vitistack.io
  resources:
  - edgepolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - security.vitistack.io
  resources:
  - edgepolicies/status
  verbs:
  - get
