## String to partially override chart.fullname template (will maintain the release name)
##
# nameOverride: ""

## String to fully override chart.fullname template
##
# fullnameOverride: ""

## Configure the controller manager deployment
##
manager:
  ## Set to false to skip manager installation
  ##
  enabled: true

  replicas: 1

  image:
    ## Container image for the controller manager.
    ## The release workflow overwrites repository and tag at publish time
    ## (see .github/workflows/release.yml, publish-helm job).
    repository: ncr.sky.nhn.no/ghcr/vitistack/edgeguard-operator
    ## Image tag (defaults to Chart.appVersion if not set)
    ##
    # tag: ""
    pullPolicy: IfNotPresent

  ## Arguments
  ##
  args:
    - --leader-elect

  ## Upstream port-reporting configuration.
  ## These are rendered into the manager's UPSTREAM_* environment variables (see the
  ## project README). They are exposed as named keys so they can be set cleanly via
  ## `helm --set` or GitOps parameters (e.g. manager.upstream.apiUrl) without
  ## depending on the order of an env list.
  ##   - apiUrl: base URL of the upstream IPAM API that receives port reports.
  ##     Leave empty ("") to disable reporting; policies with filter.enabled: true
  ##     then report UpstreamReady=False/UpstreamNotConfigured.
  ##   - reportingDisabled: set to "true" to treat every report as delivered without
  ##     any outbound call (takes precedence over apiUrl).
  ##   - insecureSkipVerify: set to "true" to skip upstream TLS certificate
  ##     verification. For trusted dev/test mirrors with self-signed certificates
  ##     only; do not enable in production.
  ##
  upstream:
    apiUrl: "https://edgeguard-api.vitistack.io/v1"
    reportingDisabled: "false"
    insecureSkipVerify: "false"

  ## Additional environment variables for the manager container, appended after the
  ## upstream variables above. Use this for anything not covered by manager.upstream.
  ##
  env: []
  # env:
  #   - name: SOME_OTHER_VAR
  #     value: "value"

  ## CA certificate bundle mount.
  ## Mount a CA bundle (e.g. an internal/corporate root CA) from a ConfigMap into
  ## the manager so it can verify TLS when the upstream API presents certificates
  ## signed by that CA. Create the ConfigMap in the release namespace yourself;
  ## this only mounts it. Prefer this over UPSTREAM_INSECURE_SKIP_VERIFY.
  ##
  caBundle:
    ## Set to true to mount the CA bundle ConfigMap into the manager container.
    ## Keep this false unless the ConfigMap below already exists in the release
    ## namespace — otherwise the manager pod cannot start (it blocks waiting for
    ## the volume to mount).
    enabled: false
    ## Name of the ConfigMap holding the CA bundle.
    configMapName: nhn-certbundle
    ## Key within the ConfigMap, also used as the mounted file name (subPath).
    fileName: nhn-certbundle.crt
    ## Absolute path the bundle file is mounted at inside the container.
    mountPath: /etc/ssl/certs/nhn-certbundle.crt

  ## Health probes.
  ## The manager serves the liveness (/healthz) and readiness (/readyz) endpoints on this port.
  ##
  healthProbe:
    # Health probe server port
    port: 8081

  ## Image pull secrets
  ##
  # imagePullSecrets:
  #   - name: myregistrykey

  ## Pod-level security settings
  ##
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  ## Container-level security settings
  ##
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: true

  ## Resource limits and requests
  ##
  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  ## Manager pod's affinity
  ##
  affinity: {}

  ## Manager pod's node selector
  ##
  nodeSelector: {}

  ## Manager pod's tolerations
  ##
  tolerations: []

  ## Deployment strategy
  ##
  # strategy:
  #   type: RollingUpdate
  #   rollingUpdate:
  #     maxSurge: 25%
  #     maxUnavailable: 25%

  ## Priority class name
  ##
  # priorityClassName: ""

  ## Topology spread constraints
  ##
  # topologySpreadConstraints: []

  ## Termination grace period seconds
  ##
  terminationGracePeriodSeconds: 10

  ## Custom Deployment labels
  ##
  # labels: {}

  ## Custom Deployment annotations
  ##
  # annotations: {}

  ## Custom Pod labels and annotations
  ##
  # pod:
  #   labels: {}
  #   annotations: {}

## RBAC configuration
##
rbac:
  ## RBAC resource scope
  ## - false (default): ClusterRole/ClusterRoleBinding (all namespaces)
  ## - true: Role/RoleBinding (release namespace only)
  ##
  namespaced: false

  ## Helper roles for CRD management (admin/editor/viewer)
  ##
  helpers:
    ## Install convenience admin/editor/viewer roles for CRDs
    ##
    enabled: false

## ServiceAccount configuration
##
serviceAccount:
  # Install default ServiceAccount provided
  enabled: true

  ## Existing ServiceAccount name (required when enabled=false)
  ## Set to "default" to use the namespace default ServiceAccount
  ## Note: When enabled=true, respects nameOverride/fullnameOverride
  ##
  # name: ""

  ## Custom ServiceAccount annotations
  ##
  # annotations: {}

  ## Custom ServiceAccount labels
  ##
  # labels: {}

## Custom Resource Definitions
##
crd:
  # Install CRDs with the chart
  enabled: true
  # Keep CRDs when uninstalling
  keep: true

## Controller metrics endpoint.
## Enable to expose /metrics endpoint
##
metrics:
  enabled: true
  # Metrics server port
  port: 8443
  # Enable secure metrics: HTTPS with certs/auth (true) or HTTP (false).
  # Note: Metrics authn/authz needs ClusterRole access.
  secure: true

## Cert-manager integration for TLS certificates.
## Required for webhook certificates and metrics endpoint certificates.
##
certManager:
  enabled: false

## Webhook server configuration
##
webhook:
  enabled: false
  # Webhook server port
  port: 9443

## Prometheus ServiceMonitor for metrics scraping.
## Requires prometheus-operator to be installed in the cluster.
##
prometheus:
  enabled: false

  ## Custom ServiceMonitor labels
  ##
  # labels: {}

  ## Custom ServiceMonitor annotations
  ##
  # annotations: {}

## Network policies for controlling traffic flow.
## Enable to restrict ingress to the controller manager.
##
networkPolicy:
  enabled: false

