{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: edgepolicies.security.vitistack.io
spec:
  group: security.vitistack.io
  names:
    kind: EdgePolicy
    listKind: EdgePolicyList
    plural: edgepolicies
    shortNames:
    - epol
    singular: edgepolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='IpamSecretReady')].reason
      name: Secret
      priority: 1
      type: string
    - jsonPath: .status.conditions[?(@.type=='UpstreamReady')].reason
      name: Upstream
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: EdgePolicy is the Schema for the edgepolicies API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of EdgePolicy
            properties:
              datacenter:
                description: |-
                  Datacenter is the availability zone this policy belongs to. It is included
                  in the upstream port report.
                enum:
                - no-east-az1
                - no-east-az2
                - no-central-az1
                - no-central-az2
                - no-west-az1
                - no-west-az2
                - no-north-az1
                - no-north-az2
                - test-south-az1
                type: string
              ddos:
                description: |-
                  DDoS configures the DDoS geographic region policy with optional additional
                  allowed IP ranges.
                properties:
                  additionalCidrList:
                    description: Additional IPv4 or IPv6 CIDR ranges allowed regardless
                      of geographic region.
                    items:
                      maxLength: 43
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: set
                    x-kubernetes-validations:
                    - message: Each entry must be a valid IPv4 or IPv6 CIDR
                      rule: self.all(cidr, isCIDR(cidr))
                  enabled:
                    default: false
                    description: |-
                      Enabled turns on the DDoS geographic region policy. Defaults to false when
                      omitted.
                    type: boolean
                  region:
                    description: Geographic region permitted by the edge policy.
                    enum:
                    - norway
                    - nordic
                    - europe
                    type: string
                type: object
              filter:
                description: Filter configures service port discovery and reporting
                  to the upstream system.
                properties:
                  additionalPortList:
                    description: |-
                      AdditionalPortList declares extra ports to report upstream in addition to the
                      ports discovered on the target Service.
                    items:
                      description: AdditionalPort is a user-declared port reported
                        upstream alongside discovered ports.
                      properties:
                        name:
                          description: Name is an optional label for the port.
                          maxLength: 63
                          type: string
                        port:
                          description: Port is the port number.
                          format: int32
                          maximum: 65535
                          minimum: 0
                          type: integer
                        protocol:
                          description: Protocol is the IP protocol for this port.
                          enum:
                          - TCP
                          - UDP
                          - ICMP
                          - ESP
                          - AH
                          - SCTP
                          - GRE
                          - OSPF
                          - IGMP
                          type: string
                      required:
                      - port
                      - protocol
                      type: object
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: atomic
                  enabled:
                    default: false
                    description: |-
                      Enabled turns on service port discovery and reporting to the upstream system.
                      Defaults to false when omitted.
                    type: boolean
                type: object
              targetRef:
                description: TargetRef references the object in the same namespace
                  that this policy applies to.
                properties:
                  apiVersion:
                    description: APIVersion of the referenced object. Only "v1" is
                      supported.
                    enum:
                    - v1
                    type: string
                  kind:
                    description: Kind of the referenced object. Only "Service" is
                      supported.
                    enum:
                    - Service
                    type: string
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - apiVersion
                - kind
                - name
                type: object
            required:
            - datacenter
            - targetRef
            type: object
            x-kubernetes-validations:
            - message: At least one of filter or ddos must be specified
              rule: has(self.filter) || has(self.ddos)
          status:
            description: status defines the observed state of EdgePolicy
            properties:
              conditions:
                description: Conditions represent the current status of the edge policy.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              observedIPs:
                description: |-
                  ObservedIPs lists the load balancer ingress IP addresses discovered on the
                  target Service.
                items:
                  maxLength: 45
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              observedPorts:
                description: ObservedPorts lists the ports discovered on the target
                  Service.
                items:
                  description: ObservedPort describes a port discovered on the target
                    Service.
                  properties:
                    name:
                      description: Name is the name of the Service port, if one is
                        set.
                      maxLength: 63
                      type: string
                    port:
                      description: Port is the port number exposed by the Service.
                      format: int32
                      type: integer
                    protocol:
                      description: Protocol is the IP protocol for this port (TCP,
                        UDP, or SCTP).
                      enum:
                      - TCP
                      - UDP
                      - SCTP
                      type: string
                  required:
                  - port
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-type: atomic
              pendingReport:
                description: |-
                  PendingReport tracks an upstream report that was accepted for asynchronous
                  processing (the status-queue flow) and whose outcome is still being polled. It is
                  nil when no report is in flight. While set, the controller polls the job's status
                  URL once per reconcile (instead of blocking or re-submitting) and requeues until
                  the job reaches a terminal state, so a reconcile worker is never held waiting on
                  the upstream.
                properties:
                  ips:
                    description: |-
                      IPs is the set of load balancer ingress addresses captured when the report was
                      submitted, recorded as ObservedIPs once the job completes successfully.
                    items:
                      maxLength: 45
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: atomic
                  jobId:
                    description: JobID identifies the queued job upstream, for logging
                      and correlation.
                    maxLength: 256
                    type: string
                  key:
                    description: |-
                      Key is the idempotency key of the submitted report. When the desired report's
                      key no longer matches (the policy or its target Service changed while the job was
                      in flight), the pending job is stale and a fresh report is submitted instead of
                      polling it.
                    maxLength: 64
                    type: string
                  ports:
                    description: |-
                      Ports is the set of discovered ports captured when the report was submitted.
                      It is recorded as ObservedPorts once the job completes successfully, so
                      ObservedPorts only ever reflects a report the upstream durably accepted.
                    items:
                      description: ObservedPort describes a port discovered on the
                        target Service.
                      properties:
                        name:
                          description: Name is the name of the Service port, if one
                            is set.
                          maxLength: 63
                          type: string
                        port:
                          description: Port is the port number exposed by the Service.
                          format: int32
                          type: integer
                        protocol:
                          description: Protocol is the IP protocol for this port (TCP,
                            UDP, or SCTP).
                          enum:
                          - TCP
                          - UDP
                          - SCTP
                          type: string
                      required:
                      - port
                      type: object
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: atomic
                  statusUrl:
                    description: StatusURL is the upstream URL polled for the queued
                      job's outcome.
                    maxLength: 2048
                    type: string
                required:
                - key
                - statusUrl
                type: object
              pendingWithdrawal:
                description: |-
                  PendingWithdrawal tracks an upstream withdrawal (DELETE) that was accepted for
                  asynchronous processing and whose outcome is still being polled. It is nil when no
                  withdrawal is in flight. While set, the controller holds the relevant finalizer
                  and polls the job's status URL once per reconcile until it completes, so deletion
                  never blocks a worker and the finalizer is released only once the upstream has
                  durably withdrawn the report.
                properties:
                  ips:
                    description: |-
                      IPs is the set of load balancer ingress addresses captured when the report was
                      submitted, recorded as ObservedIPs once the job completes successfully.
                    items:
                      maxLength: 45
                      type: string
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: atomic
                  jobId:
                    description: JobID identifies the queued job upstream, for logging
                      and correlation.
                    maxLength: 256
                    type: string
                  key:
                    description: |-
                      Key is the idempotency key of the submitted report. When the desired report's
                      key no longer matches (the policy or its target Service changed while the job was
                      in flight), the pending job is stale and a fresh report is submitted instead of
                      polling it.
                    maxLength: 64
                    type: string
                  ports:
                    description: |-
                      Ports is the set of discovered ports captured when the report was submitted.
                      It is recorded as ObservedPorts once the job completes successfully, so
                      ObservedPorts only ever reflects a report the upstream durably accepted.
                    items:
                      description: ObservedPort describes a port discovered on the
                        target Service.
                      properties:
                        name:
                          description: Name is the name of the Service port, if one
                            is set.
                          maxLength: 63
                          type: string
                        port:
                          description: Port is the port number exposed by the Service.
                          format: int32
                          type: integer
                        protocol:
                          description: Protocol is the IP protocol for this port (TCP,
                            UDP, or SCTP).
                          enum:
                          - TCP
                          - UDP
                          - SCTP
                          type: string
                      required:
                      - port
                      type: object
                    maxItems: 256
                    type: array
                    x-kubernetes-list-type: atomic
                  statusUrl:
                    description: StatusURL is the upstream URL polled for the queued
                      job's outcome.
                    maxLength: 2048
                    type: string
                required:
                - key
                - statusUrl
                type: object
              rejectedReportKey:
                description: |-
                  RejectedReportKey is the idempotency key of the last report the upstream
                  rejected with a 4xx. While it matches the key of the report the controller
                  would send next, that (unchanged) report is suppressed instead of re-attempted;
                  it is cleared once the report content changes or a report is accepted.
                maxLength: 64
                type: string
              rejectedReportMessage:
                description: |-
                  RejectedReportMessage is the human-readable detail from the upstream for the
                  report named by RejectedReportKey (e.g. the rejection body or the failed queue
                  job's message). It is surfaced in the UpstreamReady condition message and is
                  cleared alongside RejectedReportKey once the report content changes or a report
                  is accepted. Persisted so the detail stays stable across suppressed reconciles.
                maxLength: 512
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
