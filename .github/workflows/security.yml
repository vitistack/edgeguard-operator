name: Security

on:
  push:
  pull_request:

permissions: {}

jobs:
  govulncheck:
    permissions:
      contents: read
    name: govulncheck (known vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    permissions:
      contents: read
    name: gosec (static analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec
        # Scope to the operator's own code (cmd/api/internal). The e2e helpers
        # under test/ intentionally launch subprocesses and read/write manifests
        # and are already annotated with //nolint:gosec, which standalone gosec
        # does not honor.
        run: gosec -exclude-generated -exclude-dir=test ./...
