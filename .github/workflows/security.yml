name: Security

on:
  push:
  pull_request:

permissions: {}

jobs:
  govulncheck:
    permissions:
      contents: read
    name: govulncheck (known vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    permissions:
      contents: read
    name: gosec (static analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build golangci-lint
        run: make golangci-lint

      - name: Run gosec
        # gosec is run via golangci-lint rather than the standalone binary: the
        # standalone gosec release lags the Go toolchain and cannot decode the
        # newer export-data format (fails with "export data version N greater
        # than maximum supported"), whereas golangci-lint bundles a current
        # x/tools. Scope to the operator's own code (cmd/api/internal); the e2e
        # helpers under test/ intentionally launch subprocesses and read/write
        # manifests. golangci-lint honors //nolint:gosec directives.
        run: bin/golangci-lint run --default=none --enable=gosec ./cmd/... ./api/... ./internal/...
