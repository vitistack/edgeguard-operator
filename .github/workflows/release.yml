name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  create-oci-image:
    name: Create OCI Image
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/vitistack
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/vitistack/edgeguard-operator
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GITHUB_TOKEN=${{ secrets.GH_TOKEN }}

  publish-helm:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs:
      - create-oci-image
    steps:
      - uses: actions/checkout@v6

      - name: Install helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.4

      - name: install-yq
        run: |
          wget https://github.com/mikefarah/yq/releases/download/${VERSION}/${BINARY}.tar.gz -O - | tar xz && mv ${BINARY} yq && chmod +x yq
        env:
          VERSION: v4.44.5
          BINARY: yq_linux_amd64

      - name: Build helm chart
        run: |
          export HELM_VERSION=${VERSION#v*}
          # Chart version and appVersion track the release tag; appVersion uses the
          # bare (v-stripped) version so it matches the image tags pushed by the
          # create-oci-image job (docker/metadata semver {{version}}).
          ./yq e -i '.version = strenv(HELM_VERSION), .appVersion = strenv(HELM_VERSION)' chart/edgeguard-operator/Chart.yaml
          # Point the chart at the image published by the create-oci-image job,
          # served via the NHN pull-through mirror. This writes the key path the
          # manager template actually reads (.Values.manager.image.*).
          ./yq e -i '.manager.image.repository = "ncr.sky.nhn.no/ghcr/vitistack/edgeguard-operator", .manager.image.tag = strenv(HELM_VERSION)' chart/edgeguard-operator/values.yaml
          helm package chart/edgeguard-operator
          echo  ${{ secrets.GITHUB_TOKEN }} | helm registry login -u ${{ github.actor }} ghcr.io --password-stdin
          helm push edgeguard-operator-${HELM_VERSION}.tgz oci://ghcr.io/vitistack/helm/
        env:
          VERSION: ${{ github.ref_name }}